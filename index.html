/* 主题预设：在样式表加载前定下 data-theme，避免首屏闪一下别的主题。
   取值 c（精装出版物·默认）/ f（数据人文主义）/ base（原版深色）。
   优先 URL ?theme=，其次 localStorage，最后默认 c。 */
(function () {
  var OK = ["c", "f", "base"], t = "";
  try { var m = /[?&]theme=([a-z]+)/i.exec(location.search); if (m) t = m[1].toLowerCase(); } catch (e) {}
  if (OK.indexOf(t) < 0) { try { t = (localStorage.getItem("cvgTheme") || "").toLowerCase(); } catch (e) { t = ""; } }
  if (OK.indexOf(t) < 0) t = "c";
  document.documentElement.setAttribute("data-theme", t);
  window.__CVG_THEME_EARLY = t;
})();
</script>
